name: Dual Recorder

on:
  push:
    paths:
      - "dual-recorder/**"
      - ".github/workflows/dual-recorder.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dual-recorder

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Unit tests
        run: |
          mkdir -p fit-out
          FIT_OUTPUT_DIR="$PWD/fit-out" swift test

      - name: Validate FIT files with Garmin's FIT SDK
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet garmin-fit-sdk
          .venv/bin/python scripts/validate_fit.py fit-out

      - name: Build app (Apple Silicon + Intel)
        run: UNIVERSAL=1 VERSION=0.0.$GITHUB_RUN_NUMBER BUILD_NUMBER=$GITHUB_RUN_NUMBER ./build.sh --no-install

      - name: Check app bundle
        run: |
          plutil -lint "build/Dual Recorder.app/Contents/Info.plist"
          codesign --verify --verbose "build/Dual Recorder.app"
          ARCHS="$(lipo -archs "build/Dual Recorder.app/Contents/MacOS/DualRecorder")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]

      # Unsigned: checks the installer packaging on every push. Signed releases come from
      # dual-recorder-release.yml.
      - name: Build DMG (unsigned)
        run: |
          scripts/make_dmg.sh "build/Dual Recorder.app" build/Dual-Recorder-unsigned.dmg
          hdiutil verify build/Dual-Recorder-unsigned.dmg
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" build/Dual-Recorder-unsigned.dmg >/dev/null
          ls -la "$MOUNT"
          test -d "$MOUNT/Dual Recorder.app" && test -L "$MOUNT/Applications" && test -f "$MOUNT/.DS_Store"
          hdiutil detach "$MOUNT" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Dual-Recorder-unsigned-dmg
          path: dual-recorder/build/Dual-Recorder-unsigned.dmg
          retention-days: 14
